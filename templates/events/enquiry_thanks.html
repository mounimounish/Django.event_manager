{% extends 'base.html' %}

{% block title %}Event Manager • Thank You{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8 text-center">
            <div class="card shadow-sm border-0 py-5 px-4">
                <div class="d-inline-flex p-3 rounded-circle bg-primary bg-opacity-10 text-primary mb-3 mx-auto">
                    <i class="bi bi-telephone-inbound fs-1"></i>
                </div>
                <h2 class="h3 fw-bold text-dark mb-2">Thank You for Reaching Out!</h2>
                <p class="text-muted mb-4">
                    We have received your enquiry. Our event management team will get back to you shortly.
                </p>
                <div>
                    <a href="{% url 'home' %}" class="btn btn-primary">
                        <i class="bi bi-house-door me-1"></i> Return to Home
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
