{% extends 'base.html' %}

{% block title %}Event Manager • Booking Confirmed{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-7 col-md-9 text-center">
            <div class="card shadow-sm border-0 py-5 px-4">
                <div class="d-inline-flex p-3 rounded-circle bg-success bg-opacity-10 text-success mb-3 mx-auto">
                    <i class="bi bi-check-circle-fill display-3"></i>
                </div>
                
                <h1 class="h2 fw-bold text-dark mb-2">Booking Confirmed!</h1>
                <p class="text-muted lead fs-6 mb-4">
                    Your event booking has been successfully confirmed. A confirmation receipt has been sent to your email.
                </p>

                <div class="d-flex justify-content-center gap-2">
                    <a href="{% url 'home' %}" class="btn btn-primary">
                        <i class="bi bi-house-door me-1"></i> Return to Home
                    </a>
                    <a href="{% url 'profile' %}" class="btn btn-outline-secondary">
                        <i class="bi bi-person-circle me-1"></i> View Profile
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
